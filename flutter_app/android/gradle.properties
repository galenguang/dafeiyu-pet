org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---- Kotlin 增量编译关闭 ----
# 不关的话，webview_flutter_android 的 compileDebugKotlin 会稳定失败：
#   Could not close incremental caches .../cacheable/caches-jvm/jvm/kotlin
# 清 build 目录也复现，说明不是缓存陈旧，而是增量编译在这台机器上
# （Windows + 中文路径 + 便携版 Git 环境）打不开或锁不住那些 .tab 文件。
# 代价是每次改 Kotlin 要全量重编，约多 30-60 秒；
# 本项目 Kotlin 代码很少（只有 MainActivity），完全可接受。
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
